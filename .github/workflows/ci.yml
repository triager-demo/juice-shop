name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  NODE_OPTIONS: --max_old_space_size=4096

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm run build

  test:
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [frontend, server, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: Build application for API tests
        if: matrix.suite == 'api'
        run: npm run build
      - run: npm run test:${{ matrix.suite }}

  rsn:
    name: RSN
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm run rsn

  templates:
    name: Deployment templates
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate deployment templates
        run: |
          python3 -m venv /tmp/cfn-validation
          /tmp/cfn-validation/bin/pip install cfn-lint==1.58.0
          /tmp/cfn-validation/bin/cfn-lint --regions "$AWS_REGION" --template deploy/aws/*.yml
          bash -n deploy/aws/release.sh

  docker:
    name: Docker build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release image
        run: docker build --platform linux/arm64 --build-arg "VCS_REF=$GITHUB_SHA" -t juice-shop:ci .
