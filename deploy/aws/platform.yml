AWSTemplateFormatVersion: '2010-09-09'
Description: Juice Shop demo network, image registry and HTTPS ingress for a single Fargate service.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    must:
      - Deploy only the root Dockerfile, never the challenge infrastructure directory.
      - Ingress is restricted to the operator IP; tasks accept traffic only from the load balancer.
Parameters:
  AllowedClientCidr:
    Type: String
    Description: Public IPv4 address allowed to access the application, with /32 suffix.
    AllowedPattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/32$'
    ConstraintDescription: Supply a single IPv4 address followed by /32.
  CertificateArn:
    Type: String
    AllowedPattern: 'arn:aws:acm:us-east-2:[0-9]{12}:certificate/.+'
  DomainName:
    Type: String
    Default: juice-shop.stuartmehrens.com
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable
  SubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Only the operator network can access HTTPS or its HTTP redirect.
        must: [Allow only AllowedClientCidr, never allow direct public ingress to the application task.]
    Properties:
      GroupDescription: Operator-only HTTP redirect and HTTPS
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedClientCidr}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedClientCidr}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 3000, ToPort: 3000, CidrIp: 10.42.0.0/16}
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Public task IP provides image-pull egress without a NAT gateway; ingress remains load-balancer-only.
        must: [Allow application traffic only from LoadBalancerSecurityGroup.]
    Properties:
      GroupDescription: Load balancer to Juice Shop
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 3000
      TargetType: ip
      HealthCheckPath: /rest/products/search
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '404', ContentType: text/plain, MessageBody: Not found}
  HostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: host-header
          HostHeaderConfig: {Values: [!Ref DomainName]}
      Actions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      guard:
        SuppressedRules: [ELBV2_LISTENER_SSL_POLICY_RULE]
      com.aws.cloudformation.Context:
        why: HTTP only redirects to HTTPS; SSL policy belongs to the HTTPS listener.
        must: [Never forward application traffic from the HTTP listener.]
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Host: !Ref DomainName, Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Retain release images for rollback; image digest identifies each deployment.
        must: [Do not expire release images automatically.]
    Properties:
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration: {EncryptionType: AES256}
      ImageScanningConfiguration: {ScanOnPush: true}
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 7
  ExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Fargate runtime pulls images and writes logs; the application does not require AWS API credentials.
        must: [Never reuse this role as the application task role.]
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
              ArnLike: {aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'}
      Policies:
        - PolicyName: ImagePullAndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
Outputs:
  RepositoryUri:
    Description: Push images to this private registry.
    Value: !GetAtt Repository.RepositoryUri
  RepositoryArn:
    Description: Repository for the GitHub deployment role.
    Value: !GetAtt Repository.Arn
  ClusterName:
    Description: ECS cluster name.
    Value: !Ref Cluster
  Subnets:
    Description: Public subnets for Fargate egress without NAT.
    Value: !Join [',', [!Ref SubnetA, !Ref SubnetB]]
  TaskSecurityGroup:
    Description: Application ingress security group.
    Value: !Ref TaskSecurityGroup
  TargetGroupArn:
    Description: HTTPS listener target group.
    Value: !Ref TargetGroup
  ExecutionRoleArn:
    Description: Image pull and logging role, not application credentials.
    Value: !GetAtt ExecutionRole.Arn
  LogGroupName:
    Description: Application logs.
    Value: !Ref LogGroup
  LoadBalancerDns:
    Description: Squarespace juice-shop CNAME target.
    Value: !GetAtt LoadBalancer.DNSName
